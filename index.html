<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="google-site-verification" content="N3sX-jpRy8Gr78YgXzD3ph6LTYibNr2lIdwk_MNngHw" />
  
  <meta property="og:title" content="Where Is The Studio">
  <meta property="og:description" content="Hi, we are Where Is The Studio! We are independent studio based in Lampung, Indonesia. Where Is The Studio founded since November 2026 by Fahreza Yurian Rastafara. We love making apps and games.">
  <meta property="og:image" content="https://whereisthestudios.vercel.app/witslogo.png">
  <meta property="og:url" content="https://whereisthestudios.vercel.app">
  <meta property="og:type" content="website">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Where Is The Studio">
  <meta name="twitter:description" content="Hi, we are Where Is The Studio! We are independent studio based in Lampung, Indonesia. Where Is The Studio founded since November 2026 by Fahreza Yurian Rastafara. We love making apps and games.">
  <meta name="twitter:image" content="https://whereisthestudios.vercel.app/witslogo.png">
  
  <title>Where Is The Studio</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
  
  <header class="main-header">
    <div class="header-wrapper">
      <div class="logo-wrapper">
        <img src="witslogo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;" loading="lazy" onclick="window.location.reload()">
      </div>
      <span id="menu-btn">&#9776;</span>
    </div>
    <nav class="nav-btn-container">
      <ul class="nav-btn-wrapper">
        <li class="nav-btn active">
          <a href="#home">Home</a>
        </li>
        <li class="nav-btn">
          <a href="#about">About</a>
        </li>
        <li class="nav-btn">
          <a href="#project">Project</a>
        </li>
        <li class="nav-btn">
          <a href="#contact">Contact</a>
        </li>
      </ul>
    </nav>
  </header>
  
  <main class="content-container-wrapper" id="home">
    <section class="about-container" id="about">
      <h3 class="about-container-title">About</h3>
      <p class="about-container-desc"><span id="typing-text"></span><span id="cursor">|</span></p>
    </section>
    <section class="project-container" id="project">
      <h3 class="project-container-title">Project</h3>
      <div class="project-wrapper-container">
        <div class="project-wrapper-nav-btn-container">
          <ul class="project-wrapper-nav-btn-wrapper">
            <li class="project-wrapper-nav-btn active">
              <a href="#all-categories">All</a>
            </li>
            <li class="project-wrapper-nav-btn">
              <a href="#apps-categories">Apps</a>
            </li>
            <li class="project-wrapper-nav-btn">
              <a href="#games-categories">Games</a>
            </li>
            
            <li class="project-wrapper-nav-btn-indicator"></li>
          </ul>
        </div>
        <div class="project-wrapper">
          <div class="project-wrapper-addition active">
            <h4 class="project-wrapper-addition-title">Apps</h4>
            <p class="sign-under-construction">There isn't any yet.</p>
          </div>
          <div class="project-wrapper-addition active">
            <h4 class="project-wrapper-addition-title">Games</h4>
            <p class="sign-under-construction">There isn't any yet.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <footer class="contact-container" id="contact">
    <div class="link-btn-wrapper">
      <a class="link-btn" id="link-youtube" href="https://www.youtube.com/@WhereIsTheStudios" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
      <a class="link-btn" id="link-tiktok" href="https://www.tiktok.com/@where.is.the.stud" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a class="link-btn" id="link-instagram" href="https://www.instagram.com/whereisthestudios" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a class="link-btn" id="link-facebook" href="https://www.facebook.com/whereisthestudio" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <i class="fa-brands fa-facebook"></i>
      </a>
      <a class="link-btn" id="link-x" href="https://x.com/whereisthestud" target="_blank" rel="noopener noreferrer" aria-label="X/Twitter">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a class="link-btn" id="link-threads" href="https://www.threads.net/@whereisthestudios" target="_blank" rel="noopener noreferrer" aria-label="Threads">
        <i class="fa-brands fa-square-threads"></i>
      </a>
    </div>
    <p class="credit-title">© <span id="year"></span> Where Is The Studio</p>
  </footer>
  
  <script src="main.js"></script>
</body>

</html>
